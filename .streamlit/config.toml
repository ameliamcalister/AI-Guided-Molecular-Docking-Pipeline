# Settings for the public deployment. Streamlit reads this from the working
# directory, so the Dockerfile copies it next to the app.
#
# Deliberately no server port/address/headless here. Streamlit Community Cloud
# manages those itself, and hard-coding them in a file it reads risks fighting
# the platform over which port the app listens on. The Dockerfile passes them
# as CLI flags instead, where they only apply to the container.

[server]
# Receptor PDBQT files are a few MB at most. The default is 200 MB, which is
# an easy way for a stranger to fill the container's disk.
maxUploadSize = 20
# No source files change at runtime, so watching them just costs memory.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
# Tracebacks can name internal paths; show a short message instead.
showErrorDetails = false

[theme]
base = "dark"
